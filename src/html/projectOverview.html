<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="../components/render/renderProjectOverview.ts"
      type="module"
    ></script>
    <link rel="stylesheet" href="../styles/projectOverview.css" />
    <title>Project</title>
  </head>
  <body>
    <div>
      <h1>Project Overview</h1>
      <button id="temp-button">Render project</button>
      <h1 id="project-title"></h1>
      <p id="project-description"></p>
      <div><ul id="project-members-ul"></ul></div>
    </div>

    <div id="task-filters">
      <label for="status-filter">Status:</label>
      <select id="status-filter">
        <option value="all">Alla</option>
        <option value="new">Nya</option>
        <option value="ongoing">Pågående</option>
        <option value="done">Slutförda</option>
      </select>

      <label for="member-filter">Medlem:</label>
      <select id="member-filter">
        <option value="all">Alla</option>
      </select>

      <label for="category-filter">Kategori:</label>
      <select id="category-filter">
        <option value="all">Alla</option>
        <option value="backend">Backend</option>
        <option value="frontend">Frontend</option>
        <option value="ux">UX</option>
      </select>

      <label for="subtasks-filter">Deluppgifter:</label>
      <select id="subtasks-filter">
        <option value="all">Alla</option>
        <option value="hasSubtasks">Har subtask</option>
        <option value="remaining">Ej klara subtasks</option>
      </select>

      </div>
      
      <div>
        <label for="sort-filter">Sortera på:</label>
        <select id="sort-filter">
          <option value="deadline-ascending">Deadline, stigande</option>
          <option value="deadline-descending">Deadline, fallande</option>
          <option value="title-ascending">Titel, A–Ö</option>
          <option value="title-descending">Titel, Ö–A</option>
       </select>
     </div>


    <div class="SCRUM-board-container">
      <div id="new-tasks-container" class="column">
        <h3>New Tasks</h3>
        <ul id="new-tasks-list"></ul>
      </div>

      <div id="ongoing-tasks-container" class="column">
        <h3>Ongoing Tasks</h3>
        <ul id="ongoing-tasks-list"></ul>
      </div>

      <div id="finished-tasks-container" class="column">
        <h3>Finished Tasks</h3>
        <ul id="finished-tasks-list"></ul>
      </div>
    </div>
  </body>
</html>
